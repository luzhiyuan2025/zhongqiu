<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中秋快乐 · 一封带菠萝的贺卡</title>
<meta name="description" content="月圆之夜，凤梨正甜。一封可以发给朋友的中秋贺卡，带菠萝元素。">
<meta name="theme-color" content="#0a0e27">
<meta property="og:type" content="website">
<meta property="og:title" content="中秋快乐 · 一封带菠萝的贺卡">
<meta property="og:description" content="月圆之夜，凤梨正甜。轻触开启这份祝福。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 9c5 0 8 4 8 9s-4 10-8 10-8-5-8-10 3-9 8-9z' fill='%23f5b731'/%3E%3Cpath d='M16 10c-2-5-4-7-6-8 2 4 4 6 5 8zm1 0c1-5 3-7 5-8-2 4-4 6-5 8z' fill='%234aa356'/%3E%3C/svg%3E">
<style>
  :root{
    --gold:#ffd166;
    --gold-deep:#e8940f;
    --cream:#fff6e0;
    --leaf:#4aa356;
    --night:#070a1c;
    --font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-serif:"STKaiti","Kaiti SC","KaiTi","Songti SC","STSong","SimSun","Noto Serif SC",serif;
    --ease:cubic-bezier(.22,.75,.24,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    background:radial-gradient(130% 95% at 50% 108%,#2a1d4e 0%,#171034 42%,#070a1c 100%) fixed;
    color:var(--cream);
    font-family:var(--font-sans);
    line-height:1.75;
    overflow-x:hidden;
  }
  /* ---------- 背景层 ---------- */
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
  .hill{position:fixed;left:0;right:0;bottom:0;height:34vh;min-height:190px;z-index:1;pointer-events:none}
  .hill svg{width:100%;height:100%;display:block}

  .moon{
    position:fixed;top:7vh;right:9vw;width:min(32vmin,168px);aspect-ratio:1;border-radius:50%;z-index:2;
    background:
      radial-gradient(circle at 35% 31%,rgba(186,152,80,.32) 0 7%,transparent 8%),
      radial-gradient(circle at 63% 57%,rgba(186,152,80,.26) 0 5.5%,transparent 6.5%),
      radial-gradient(circle at 44% 74%,rgba(186,152,80,.22) 0 4.5%,transparent 5.5%),
      radial-gradient(circle at 31% 26%,#fffdf3,#ffeaa9 56%,#f4cc6d 100%);
    box-shadow:0 0 55px 10px rgba(255,214,120,.34),0 0 170px 62px rgba(255,188,80,.16);
    animation:bob 9s ease-in-out infinite;
    pointer-events:none;
  }
  .moon::after{
    content:"";position:absolute;inset:-45%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,214,120,.20),transparent 62%);
    animation:breathe 7s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}

  /* 菠萝孔明灯 */
  .lanterns{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .lantern{
    position:absolute;bottom:-22vh;left:var(--x);width:var(--w,46px);
    opacity:0;animation:rise var(--d,20s) linear var(--delay,0s) infinite;
    filter:drop-shadow(0 0 10px rgba(255,178,70,.6));
  }
  .lantern svg{width:100%;height:auto;display:block}
  @keyframes rise{
    0%{opacity:0;transform:translate3d(0,0,0) rotate(-3deg)}
    12%{opacity:.95}
    50%{transform:translate3d(24px,-60vh,0) rotate(4deg)}
    88%{opacity:.9}
    100%{opacity:0;transform:translate3d(-14px,-132vh,0) rotate(-2deg)}
  }

  /* ---------- 贺卡 ---------- */
  .wrap{
    position:relative;z-index:3;min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:calc(22px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
  }
  .card{
    position:relative;width:100%;max-width:620px;text-align:center;
    padding:clamp(26px,6vw,46px) clamp(20px,5.5vw,44px) clamp(24px,5vw,40px);
    border-radius:26px;
    background:linear-gradient(160deg,rgba(255,246,224,.10),rgba(255,246,224,.035) 60%,rgba(255,209,102,.06));
    border:1px solid rgba(255,209,102,.34);
    box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 0 70px rgba(255,209,102,.07);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  }
  .card::before{
    content:"";position:absolute;inset:8px;border-radius:19px;pointer-events:none;
    border:1px solid rgba(255,209,102,.18);
  }
  .mooncake{width:clamp(96px,26vw,132px);height:auto;display:block;margin:0 auto 4px;
    filter:drop-shadow(0 8px 26px rgba(255,170,50,.42));animation:bob 7s ease-in-out infinite}

  .kicker{
    margin:14px 0 0;font-size:clamp(10px,2.9vw,12px);letter-spacing:.42em;
    color:rgba(255,209,102,.78);text-indent:.42em;
  }
  h1{
    font-family:var(--font-serif);
    font-size:clamp(40px,12vw,70px);line-height:1.15;margin:6px 0 2px;font-weight:700;
    letter-spacing:.12em;text-indent:.12em;
    background:linear-gradient(180deg,#fffdf3,#ffe6a4 45%,#e8a92c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px rgba(255,180,60,.34));
  }
  .sub{font-family:var(--font-serif);font-size:clamp(14px,4vw,18px);letter-spacing:.2em;
    color:rgba(255,246,224,.72);margin:2px 0 0;text-indent:.2em}
  .divider{display:flex;align-items:center;gap:12px;margin:22px 0 20px;justify-content:center;color:rgba(255,209,102,.55)}
  .divider i{display:block;height:1px;flex:1;max-width:110px;
    background:linear-gradient(90deg,transparent,rgba(255,209,102,.55),transparent)}
  .divider svg{width:20px;height:20px;flex:none;opacity:.9}

  .to{margin:0 0 14px;font-size:clamp(14px,4.1vw,17px);color:#ffe6a4;letter-spacing:.08em}
  .wish{
    margin:0 auto;max-width:27em;font-size:clamp(15px,4.4vw,19px);line-height:2.1;
    color:rgba(255,246,224,.94);font-family:var(--font-serif);letter-spacing:.05em;
    min-height:4.2em;transition:opacity .34s var(--ease),transform .34s var(--ease);
  }
  .wish.swap{opacity:0;transform:translateY(8px)}
  .from{margin:18px 0 0;font-size:clamp(13px,3.8vw,15px);color:rgba(255,209,102,.8);letter-spacing:.1em}

  .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
  button{
    font-family:inherit;font-size:clamp(12.5px,3.6vw,14px);letter-spacing:.06em;
    color:#ffe6a4;background:rgba(255,209,102,.07);
    border:1px solid rgba(255,209,102,.42);border-radius:999px;
    padding:10px 18px;cursor:pointer;transition:.22s var(--ease);
    display:inline-flex;align-items:center;gap:6px;
  }
  button:hover{background:rgba(255,209,102,.17);border-color:rgba(255,209,102,.8);transform:translateY(-2px)}
  button:active{transform:translateY(0) scale(.97)}
  button.primary{background:linear-gradient(180deg,#ffdd8a,#e8a92c);color:#3a2405;border-color:transparent;font-weight:600}
  button.primary:hover{background:linear-gradient(180deg,#ffe8a6,#f0b43a)}
  button[aria-pressed="false"]{opacity:.55}

  /* ---------- 信封封面 ---------- */
  .cover{
    position:fixed;inset:0;z-index:9;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:20px;
    background:radial-gradient(120% 90% at 50% 100%,#241a44,#0b0e22 60%,#05070f);
    transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease);
    padding:24px;
  }
  body.js .cover{display:flex}
  .cover.gone{opacity:0;transform:translateY(40px) scale(1.04);filter:blur(10px);pointer-events:none}
  .env{position:relative;width:min(78vw,320px);aspect-ratio:1.5/1;cursor:pointer;
    perspective:900px;animation:bob 6s ease-in-out infinite}
  .env-back,.env-letter,.env-flap{position:absolute;inset:0;border-radius:14px}
  .env-back{
    background:linear-gradient(160deg,#ffdf9a,#e9a92c);
    box-shadow:0 26px 60px rgba(0,0,0,.55),inset 0 0 40px rgba(255,255,255,.28);
    overflow:hidden;
  }
  .env-back::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(150deg,transparent 48%,rgba(180,110,10,.28) 49% 51%,transparent 52%);
  }
  .env-letter{
    inset:9% 8% auto;height:76%;border-radius:10px;
    background:linear-gradient(180deg,#fffaf0,#ffeecd);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    color:#8a5a12;font-family:var(--font-serif);font-size:clamp(17px,5vw,22px);letter-spacing:.24em;
    box-shadow:0 8px 24px rgba(120,70,0,.25);
    transition:transform .85s var(--ease) .15s;z-index:2;
  }
  .env-letter small{font-family:var(--font-sans);font-size:11px;letter-spacing:.3em;color:#b8892f}
  .env-flap{
    z-index:3;transform-origin:top center;transform:rotateX(0);
    background:linear-gradient(180deg,#ffe6ab,#f0b53c);
    clip-path:polygon(0 0,100% 0,50% 62%);
    border-radius:14px 14px 0 0;
    box-shadow:0 6px 18px rgba(0,0,0,.28);
    transition:transform .8s var(--ease);
    backface-visibility:hidden;
  }
  .seal{
    position:absolute;left:50%;top:52%;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:5;
    border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 34% 30%,#ff9c8a,#c0342b 70%);
    box-shadow:0 8px 22px rgba(150,20,10,.5),inset 0 0 12px rgba(255,255,255,.35);
    transition:transform .45s var(--ease),opacity .35s;
  }
  .seal::before{content:"";position:absolute;inset:5px;border-radius:50%;border:1px dashed rgba(255,235,220,.55)}
  .seal svg{width:34px;height:36px}
  .cover.opening .env-flap{transform:rotateX(-168deg)}
  .cover.opening .env-letter{transform:translateY(-34%) scale(.98)}
  .cover.opening .seal{transform:scale(.55) rotate(-24deg);opacity:0}
  .cover .hint{margin:0;font-size:13px;letter-spacing:.4em;text-indent:.4em;color:rgba(255,209,102,.8);
    animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  /* ---------- 出场动画 ---------- */
  body.js:not(.open) .moon{opacity:0;transform:translateY(60px) scale(.94)}
  body.js:not(.open) .card{opacity:0;transform:translateY(30px) scale(.97)}
  body.js:not(.open) .lanterns{opacity:0}
  .moon,.card,.lanterns{transition:opacity 1.1s var(--ease),transform 1.2s var(--ease)}
  body.open .card>*{animation:in .9s var(--ease) both}
  body.open .card>*:nth-child(1){animation-delay:.15s}
  body.open .card>*:nth-child(2){animation-delay:.25s}
  body.open .card>*:nth-child(3){animation-delay:.33s}
  body.open .card>*:nth-child(4){animation-delay:.41s}
  body.open .card>*:nth-child(5){animation-delay:.49s}
  body.open .card>*:nth-child(6){animation-delay:.57s}
  body.open .card>*:nth-child(7){animation-delay:.65s}
  body.open .card>*:nth-child(8){animation-delay:.73s}
  body.open .card>*:nth-child(9){animation-delay:.81s}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ---------- 定制面板 / 提示 ---------- */
  .panel{
    position:fixed;z-index:12;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));
    transform:translateY(110%);visibility:hidden;
    transition:transform .5s var(--ease),visibility .5s;
  }
  .panel.show{transform:none;visibility:visible}
  .panel-inner{
    max-width:560px;margin:0 auto;border-radius:22px;padding:22px 20px;
    background:linear-gradient(170deg,rgba(28,22,54,.97),rgba(12,14,34,.97));
    border:1px solid rgba(255,209,102,.35);box-shadow:0 -14px 50px rgba(0,0,0,.6);
  }
  .panel h3{margin:0 0 16px;font-size:15px;letter-spacing:.16em;color:#ffe6a4;font-weight:600}
  .field{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .field span{flex:none;width:3.6em;font-size:13px;color:rgba(255,246,224,.7)}
  .field input{
    flex:1;min-width:0;font-family:inherit;font-size:15px;color:var(--cream);
    background:rgba(255,246,224,.07);border:1px solid rgba(255,209,102,.28);
    border-radius:12px;padding:11px 14px;outline:none;transition:.2s;
  }
  .field input:focus{border-color:rgba(255,209,102,.8);background:rgba(255,246,224,.12)}
  .field input::placeholder{color:rgba(255,246,224,.3)}
  .panel-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .panel-actions button{flex:1;justify-content:center;min-width:130px}
  .tip{margin:14px 0 0;font-size:12px;line-height:1.8;color:rgba(255,246,224,.45)}

  .toast{
    position:fixed;z-index:20;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));
    transform:translate(-50%,26px);opacity:0;pointer-events:none;
    background:rgba(20,16,40,.94);border:1px solid rgba(255,209,102,.45);color:#ffe6a4;
    padding:11px 20px;border-radius:999px;font-size:13.5px;letter-spacing:.05em;
    box-shadow:0 12px 34px rgba(0,0,0,.5);transition:.4s var(--ease);white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:520px){
    .moon{top:5vh;right:7vw}
    .hill{height:26vh}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>

<!-- ===== 复用图形定义 ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="pineBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe79b"/><stop offset=".45" stop-color="#f5b731"/><stop offset="1" stop-color="#d9821b"/>
    </linearGradient>
    <linearGradient id="pineLeaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f7a3d"/><stop offset="1" stop-color="#6cc46f"/>
    </linearGradient>
    <linearGradient id="cakeG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a8"/><stop offset=".55" stop-color="#f0b64a"/><stop offset="1" stop-color="#cf8a1c"/>
    </linearGradient>
    <linearGradient id="lantG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9d3c"/><stop offset=".5" stop-color="#ffd166"/><stop offset="1" stop-color="#fff3c9"/>
    </linearGradient>
    <pattern id="lattice" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H12M0 0V12" stroke="#a85f10" stroke-opacity=".38" stroke-width="1.4" fill="none"/>
    </pattern>
    <clipPath id="bodyClip">
      <path d="M50 14c26 0 38 16 38 40 0 26-16 46-38 46S12 80 12 54c0-24 12-40 38-40z"/>
    </clipPath>

    <!-- 菠萝 -->
    <symbol id="pineapple" viewBox="-10 -14 120 128">
      <path d="M50 30C42 18 36 8 30 -6c10 6 18 18 24 32z" fill="url(#pineLeaf)"/>
      <path d="M50 30C52 14 54 4 58 -8c4 10 4 24-2 36z" fill="#5cbc63"/>
      <path d="M50 30C58 18 66 8 78 -2c-6 12-16 24-26 32z" fill="url(#pineLeaf)"/>
      <path d="M50 30C42 20 32 12 18 6c10 10 22 20 32 24z" fill="#4aa356"/>
      <path d="M50 30C60 22 72 16 88 12c-12 10-26 18-38 18z" fill="#4aa356"/>
      <path d="M50 30C44 20 36 12 24 2c14 8 22 18 26 28z" fill="#3f8f4a"/>
      <path d="M50 14c26 0 38 16 38 40 0 26-16 46-38 46S12 80 12 54c0-24 12-40 38-40z" fill="url(#pineBody)"/>
      <g clip-path="url(#bodyClip)"><rect x="-10" y="-14" width="120" height="128" fill="url(#lattice)"/></g>
      <path d="M50 14c26 0 38 16 38 40 0 26-16 46-38 46S12 80 12 54c0-24 12-40 38-40z" fill="none"
            stroke="#b8720f" stroke-opacity=".45" stroke-width="2"/>
      <ellipse cx="37" cy="44" rx="9" ry="13" fill="#fff" opacity=".2" transform="rotate(-18 37 44)"/>
    </symbol>

    <!-- 菠萝孔明灯 -->
    <symbol id="lantern" viewBox="0 0 60 78">
      <path d="M30 3c16 0 25 12 25 27 0 15-9 27-25 34C14 57 5 45 5 30 5 15 14 3 30 3z" fill="url(#lantG)" opacity=".95"/>
      <path d="M30 3c16 0 25 12 25 27 0 15-9 27-25 34" fill="none" stroke="#c9761a" stroke-opacity=".35" stroke-width="1.5"/>
      <use href="#pineapple" x="17" y="16" width="26" height="28"/>
      <path d="M30 64c2.4 3.4 2.4 6.6 0 9-2.4-2.4-2.4-5.6 0-9z" fill="#ffd166"/>
      <path d="M18 68h24" stroke="#ffe6a4" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<canvas id="sky" aria-hidden="true"></canvas>

<div class="moon" aria-hidden="true"></div>

<div class="lanterns" id="lanterns" aria-hidden="true"></div>

<div class="hill" aria-hidden="true">
  <svg viewBox="0 0 1200 320" preserveAspectRatio="none">
    <path d="M0 226C120 166 200 206 302 154 402 104 470 176 562 134 662 88 762 154 862 122 962 92 1082 152 1200 122V320H0Z" fill="#151838"/>
    <path d="M0 264C142 224 242 254 342 218 462 174 562 234 682 208 802 182 902 238 1022 212 1102 196 1162 218 1200 208V320H0Z" fill="#0d1029"/>
    <g fill="#05070f">
      <path d="M300 240Q342 208 384 240q-22-10-42-10t-42 10z"/>
      <rect x="331" y="238" width="7" height="24" rx="2"/>
      <rect x="357" y="238" width="7" height="24" rx="2"/>
      <circle cx="347" cy="228" r="5" fill="#ffcf6b" opacity=".85"/>
      <path d="M336 216h22" stroke="#05070f" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="M0 320C200 288 380 312 560 298 760 282 940 310 1200 290V320Z" fill="#05070f"/>
  </svg>
</div>

<main class="wrap">
  <section class="card" id="card">
    <svg class="mooncake" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="53" fill="url(#cakeG)"/>
      <circle cx="60" cy="60" r="53" fill="none" stroke="#b5761a" stroke-opacity=".5" stroke-width="3"/>
      <circle cx="60" cy="60" r="44" fill="none" stroke="#b5761a" stroke-opacity=".32" stroke-width="1.4" stroke-dasharray="3 5"/>
      <use href="#pineapple" x="30" y="27" width="60" height="64"/>
      <g fill="#b5761a" opacity=".5">
        <circle cx="60" cy="15" r="2.6"/><circle cx="60" cy="105" r="2.6"/>
        <circle cx="15" cy="60" r="2.6"/><circle cx="105" cy="60" r="2.6"/>
      </g>
    </svg>

    <p class="kicker">农历八月十五</p>
    <h1>中秋快乐</h1>
    <p class="sub">月圆 · 凤梨正甜</p>

    <div class="divider" aria-hidden="true">
      <i></i>
      <svg viewBox="-10 -14 120 128"><use href="#pineapple"/></svg>
      <i></i>
    </div>

    <p class="to" id="toLine">致 亲爱的宝宝</p>
    <p class="wish" id="wishText">愿你的日子像凤梨，外头带点小刺，心里全是甜。</p>
    <p class="from" id="fromLine">—— 一位惦记着你的人</p>

    <div class="actions">
      <button class="primary" id="btnNext" type="button">换一句祝福</button>
      <button id="btnCopy" type="button">复制祝福</button>
      <button id="btnCustom" type="button">定制专属</button>
      <button id="btnMusic" type="button" aria-pressed="false">♪ 音乐</button>
    </div>
  </section>
</main>

<div class="cover" id="cover">
  <div class="env" id="env" role="button" tabindex="0" aria-label="点击开启中秋贺卡">
    <div class="env-back"></div>
    <div class="env-letter">中秋快乐<small>OPEN ME</small></div>
    <div class="env-flap"></div>
    <div class="seal"><svg viewBox="-10 -14 120 128" aria-hidden="true"><use href="#pineapple"/></svg></div>
  </div>
  <p class="hint">轻触开启</p>
</div>

<div class="panel" id="panel">
  <div class="panel-inner">
    <h3>做一张专属贺卡</h3>
    <label class="field"><span>致</span><input id="inTo" maxlength="16" placeholder="美燕"></label>
    <label class="field"><span>落款</span><input id="inFrom" maxlength="16" placeholder="远远"></label>
    <div class="panel-actions">
      <button class="primary" id="btnApply" type="button">保存并预览</button>
      <button id="btnLink" type="button">分享给朋友</button>
    </div>
    <p class="tip">点「分享给朋友」会带着名字生成链接，朋友打开就能看到写给他/她的那一句。<br>也可以直接分享本页链接，让朋友自己填名字。</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  document.body.classList.add('js');

  var $ = function(id){ return document.getElementById(id); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= 文案 ================= */
  var WISHES = [
    "愿你的日子像凤梨，外头带点小刺，心里全是甜。",
    "月亮一年圆一次，你值得天天甜。这一块凤梨月饼，先敬你。",
    "花好月圆，凤梨正甜。愿你所盼皆如愿，所行皆坦途。",
    "隔着千山万水，我们抬头看的是同一轮月亮。中秋快乐。",
    "愿你的生活像菠萝包，边边角角都好吃，里里外外都温暖。",
    "今夜的月光很甜，像凤梨，也像你笑起来的样子。",
    "愿你所求皆有回响，所念皆在身旁；月饼分你一半，甜事分你两半。",
    "月满，心也满。愿凤梨的清甜，替你收好这一整年的辛苦。",
    "我们以后要甜甜蜜蜜的在一辈子，愿意吗美燕。"
  ];

  /* ================= 个性化参数 ================= */
  var params = new URLSearchParams(location.search);
  var state = {
    to:   (params.get('to')   || '').trim().slice(0, 16),
    from: (params.get('from') || '').trim().slice(0, 16),
    wish: parseInt(params.get('wish') || '', 10)
  };
  if (isNaN(state.wish) || state.wish < 0 || state.wish >= WISHES.length) {
    state.wish = Math.floor(Math.random() * WISHES.length);
  }
  try {
    var saved = JSON.parse(localStorage.getItem('zq-pineapple') || 'null');
    if (saved && typeof saved === 'object') {
      if (!state.to && saved.to) state.to = String(saved.to).slice(0, 16);
      if (!state.from && saved.from) state.from = String(saved.from).slice(0, 16);
    }
  } catch(e){}

  var toLine = $('toLine'), fromLine = $('fromLine'), wishText = $('wishText');
  function renderIdentity(){
    toLine.textContent   = state.to   ? ('致 ' + state.to)          : '致 亲爱的朋友';
    fromLine.textContent = state.from ? ('—— 来自 ' + state.from)   : '—— 一位惦记着你的人';
    $('inTo').value = state.to;
    $('inFrom').value = state.from;
  }
  renderIdentity();
  wishText.textContent = WISHES[state.wish];

  /* ================= 提示条 ================= */
  var toast = $('toast'), toastTimer;
  function say(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2000);
  }

  /* ================= 开启贺卡 ================= */
  var cover = $('cover'), opened = false;
  function openCard(){
    if (opened) return;
    opened = true;
    cover.classList.add('opening');
    setTimeout(function(){
      document.body.classList.add('open');
      cover.classList.add('gone');
      spawnLanterns();
      startSky();
      music.start();
    }, 760);
    setTimeout(function(){ cover.style.display = 'none'; }, 1900);
  }
  $('env').addEventListener('click', openCard);
  $('env').addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(); }
  });

  /* ================= 换一句 ================= */
  $('btnNext').addEventListener('click', function(){
    var next = state.wish;
    while (next === state.wish && WISHES.length > 1) next = Math.floor(Math.random() * WISHES.length);
    state.wish = next;
    wishText.classList.add('swap');
    setTimeout(function(){
      wishText.textContent = WISHES[state.wish];
      wishText.classList.remove('swap');
    }, 340);
  });

  /* ================= 祝词文本 ================= */
  function wishPlain(){
    var head = state.to ? ('致 ' + state.to + '：\n') : '';
    var foot = state.from ? ('\n—— 来自 ' + state.from) : '\n—— 一位惦记着你的人';
    return head + WISHES[state.wish] + foot + '\n中秋快乐，凤梨正甜。';
  }
  function copyText(text, okMsg){
    var done = function(){ say(okMsg); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function(){ fallback(); });
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta);
      say(ok ? okMsg : '复制失败，长按文字手动复制吧');
    }
  }

  $('btnCopy').addEventListener('click', function(){
    copyText(wishPlain() + '\n' + shareUrl(), '祝福已复制，去粘贴给朋友吧 ✓');
  });

  /* ================= 专属链接 ================= */
  function shareUrl(){
    var u = new URL(location.href);
    u.search = '';
    u.hash = '';
    var p = new URLSearchParams();
    if (state.to)   p.set('to', state.to);
    if (state.from) p.set('from', state.from);
    p.set('wish', String(state.wish));
    u.search = p.toString();
    return u.toString();
  }
  function saveLocal(){
    try { localStorage.setItem('zq-pineapple', JSON.stringify({to:state.to, from:state.from})); } catch(e){}
  }

  var panel = $('panel');
  $('btnCustom').addEventListener('click', function(){
    panel.classList.toggle('show');
    if (panel.classList.contains('show')) setTimeout(function(){ $('inTo').focus(); }, 320);
  });
  $('btnApply').addEventListener('click', function(){
    state.to   = $('inTo').value.trim().slice(0,16);
    state.from = $('inFrom').value.trim().slice(0,16);
    renderIdentity(); saveLocal();
    history.replaceState(null, '', shareUrl());
    say('已更新 ✓');
    panel.classList.remove('show');
  });
  $('btnLink').addEventListener('click', function(){
    state.to   = $('inTo').value.trim().slice(0,16);
    state.from = $('inFrom').value.trim().slice(0,16);
    renderIdentity(); saveLocal();
    var url = shareUrl();
    history.replaceState(null, '', url);
    if (navigator.share) {
      navigator.share({ title:'中秋快乐 · 一封带菠萝的贺卡', text: wishPlain(), url: url })
        .catch(function(){ copyText(url, '链接已复制 ✓'); });
    } else {
      copyText(url, '链接已复制，发给朋友即可 ✓');
    }
  });

  /* ================= 音乐（WebAudio，无需音频文件） ================= */
  var music = (function(){
    var ac = null, master = null, timer = null, playing = false, step = 0;
    var SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50]; // C 宫调五声
    var btn = $('btnMusic');
    function pluck(freq, when, dur, vol){
      var o = ac.createOscillator(), o2 = ac.createOscillator();
      var g = ac.createGain(), lp = ac.createBiquadFilter();
      o.type = 'triangle'; o.frequency.value = freq;
      o2.type = 'sine';     o2.frequency.value = freq * 2.005;
      lp.type = 'lowpass';  lp.frequency.value = 2400; lp.Q.value = .6;
      g.gain.setValueAtTime(0.0001, when);
      g.gain.linearRampToValueAtTime(vol, when + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(master);
      o.start(when); o2.start(when);
      o.stop(when + dur + .05); o2.stop(when + dur + .05);
    }
    function bar(){
      var t = ac.currentTime + .06;
      var n = SCALE[Math.floor(Math.random() * SCALE.length)];
      pluck(n, t, 2.4, .11);
      if (Math.random() < .55) pluck(SCALE[Math.floor(Math.random() * SCALE.length)], t + .34, 2.0, .07);
      if (step % 4 === 0) pluck(step % 8 === 0 ? 130.81 : 174.61, t, 3.4, .10);
      step++;
    }
    function ensure(){
      if (ac) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = .5;
      master.connect(ac.destination);
    }
    return {
      start: function(){
        ensure();
        if (!ac || playing) return;
        if (ac.state === 'suspended') ac.resume();
        playing = true;
        btn.setAttribute('aria-pressed', 'true');
        bar();
        timer = setInterval(bar, 1150);
      },
      stop: function(){
        if (!ac) return;
        playing = false;
        clearInterval(timer); timer = null;
        btn.setAttribute('aria-pressed', 'false');
        if (master) master.gain.setTargetAtTime(0.0001, ac.currentTime, .12);
      },
      toggle: function(){
        ensure();
        if (playing) {
          this.stop();
        } else {
          if (master) master.gain.setTargetAtTime(.5, ac.currentTime, .2);
          this.start();
        }
      }
    };
  })();
  $('btnMusic').addEventListener('click', function(){ music.toggle(); });

  /* ================= 星空 + 桂花雨 ================= */
  var cvs = $('sky'), ctx = cvs.getContext('2d');
  var W = 0, H = 0, stars = [], petals = [], running = false, rafId = null, t0 = performance.now();
  function build(){
    stars = [];
    var count = Math.round(Math.min(150, (W * H) / 12000));
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H * .82,
        r: Math.random() * 1.25 + .35,
        a: Math.random() * .6 + .25,
        s: Math.random() * 1.6 + .5,
        p: Math.random() * Math.PI * 2
      });
    }
    petals = [];
    if (reduce) return;
    var pc = W < 620 ? 20 : 32;
    for (var j = 0; j < pc; j++) {
      petals.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 2.6 + 2,
        vy: Math.random() * .36 + .22,
        sw: Math.random() * 26 + 12,
        p: Math.random() * Math.PI * 2,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - .5) * .02,
        a: Math.random() * .35 + .3
      });
    }
  }
  function resizeSky(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }
  function draw(now){
    var t = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    var i, s, p;
    for (i = 0; i < stars.length; i++) {
      s = stars[i];
      var tw = s.a + Math.sin(t * s.s + s.p) * .3;
      ctx.globalAlpha = Math.max(.05, Math.min(1, tw));
      ctx.fillStyle = '#fff6e0';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
    }
    for (i = 0; i < petals.length; i++) {
      p = petals[i];
      p.y += p.vy;
      p.rot += p.vr;
      p.p += .012;
      var x = p.x + Math.sin(p.p) * p.sw;
      if (p.y > H + 12) { p.y = -14; p.x = Math.random() * W; }
      ctx.globalAlpha = p.a;
      ctx.fillStyle = '#ffd97d';
      ctx.save();
      ctx.translate(x, p.y);
      ctx.rotate(p.rot);
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r, p.r * .52, 0, 0, 6.2832);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r * .52, p.r, Math.PI / 2, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (running) rafId = requestAnimationFrame(draw);
  }
  function startSky(){
    if (running || reduce) return;
    running = true;
    t0 = performance.now();
    rafId = requestAnimationFrame(draw);
  }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
    } else if (opened && !reduce) {
      startSky();
    }
  });
  resizeSky();
  window.addEventListener('resize', resizeSky);
  if (reduce) { ctx.clearRect(0,0,W,H); draw(performance.now()); running = false; }

  /* ================= 孔明灯 ================= */
  function spawnLanterns(){
    if (reduce) return;
    var box = $('lanterns');
    if (box.childElementCount) return;
    var n = window.innerWidth < 620 ? 6 : 9;
    for (var i = 0; i < n; i++) {
      var d = document.createElement('div');
      d.className = 'lantern';
      var w = 30 + Math.random() * 30;
      d.style.setProperty('--x', (4 + Math.random() * 88) + '%');
      d.style.setProperty('--w', w.toFixed(0) + 'px');
      d.style.setProperty('--d', (17 + Math.random() * 12).toFixed(1) + 's');
      d.style.setProperty('--delay', (Math.random() * 12).toFixed(1) + 's');
      d.innerHTML = '<svg viewBox="0 0 60 78"><use href="#lantern"/></svg>';
      box.appendChild(d);
    }
  }

  /* ================= 键盘：Esc 关面板 ================= */
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') panel.classList.remove('show');
  });
})();
</script>
</body>
</html>
